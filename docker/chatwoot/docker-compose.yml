version: '3.8'

services:
  chatwoot-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
    volumes:
      - chatwoot_db_data:/var/lib/postgresql/data
    networks:
      - chatwoot-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  chatwoot-redis:
    image: redis:7-alpine
    volumes:
      - chatwoot_redis_data:/data
    networks:
      - chatwoot-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  chatwoot-web:
    image: chatwoot/chatwoot:latest
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FRONTEND_URL=${FRONTEND_URL:-https://chat.msouza.com.br}
      - POSTGRES_HOST=chatwoot-db
      - POSTGRES_USERNAME=chatwoot
      - POSTGRES_PASSWORD=${CHATWOOT_DB_PASSWORD}
      - POSTGRES_DATABASE=chatwoot_production
      - REDIS_URL=redis://chatwoot-redis:6379
      - DEFAULT_LOCALE=pt_BR
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - traefik-public
      - chatwoot-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.http.routers.chatwoot.rule=Host(`chat.msouza.com.br`)"
        - "traefik.http.routers.chatwoot.entrypoints=websecure"
        - "traefik.http.routers.chatwoot.tls=true"
        - "traefik.http.routers.chatwoot.tls.certresolver=letsencrypt"
        - "traefik.http.services.chatwoot.loadbalancer.server.port=3000"

  chatwoot-worker:
    image: chatwoot/chatwoot:latest
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      - RAILS_ENV=production
      - NODE_ENV=production
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - FRONTEND_URL=${FRONTEND_URL:-https://chat.msouza.com.br}
      - POSTGRES_HOST=chatwoot-db
      - POSTGRES_USERNAME=chatwoot
      - POSTGRES_PASSWORD=${CHATWOOT_DB_PASSWORD}
      - POSTGRES_DATABASE=chatwoot_production
      - REDIS_URL=redis://chatwoot-redis:6379
      - DEFAULT_LOCALE=pt_BR
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - chatwoot-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  traefik-public:
    external: true
  chatwoot-internal:
    driver: overlay

volumes:
  chatwoot_db_data:
  chatwoot_redis_data:
  chatwoot_storage:
